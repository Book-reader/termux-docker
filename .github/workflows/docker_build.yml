name: Build and push Docker image

on:
  push:
    branches:
    - deblobbify
  pull_request:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  CI: true
  DOCKER_BUILDKIT: 1

jobs:
  generate:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
            package-manager: apt
          - runner: ubuntu-24.04-arm
            architecture: aarch64
            package-manager: apt
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:

    - name: Set variables
      run: |
        echo "TERMUX_ARCH=${{ matrix.architecture }}" >> $GITHUB_ENV
        echo "TERMUX_PACKAGE_MANAGER=${{ matrix.package-manager }}" >> $GITHUB_ENV
        if [ ${{ matrix.package-manager }} = apt ]; then
          echo "TERMUX_DOCKER__IMAGE_NAME=termux/termux-docker" >> $GITHUB_ENV
        elif [ ${{ matrix.package-manager }} = pacman ]; then
          echo "TERMUX_DOCKER__IMAGE_NAME=termux/termux-docker-pacman" >> $GITHUB_ENV
        fi

    - name: Clone repository
      uses: actions/checkout@v4

    - name: Build image
      run: ./generate.sh

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to Docker Hub
      run: |
        docker push ghcr.io/book-reader/termux:${{ matrix.architecture }}
